name: Windows

on:
  workflow_dispatch:
  # Called by nightly-release.yml; keep this workflow's own triggers unchanged.
  workflow_call:
  push:
    branches:
      - main
      - ci/*
  pull_request:
    branches:
      - main

env:
  VCPKG_COMMIT: 9b965a116838c6cdcd36bca60d1b81b030c8ab8d
  MELONDS_GIT_BRANCH: ${{ github.ref }}
  MELONDS_GIT_HASH: ${{ github.sha }}
  MELONDS_BUILD_PROVIDER: GitHub Actions
#  MELONDS_VERSION_SUFFIX: " RC"
  VCPKG_MAX_CONCURRENCY: 8
  CMAKE_BUILD_PARALLEL_LEVEL: 8
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_binary_cache,readwrite

jobs:
  build:
    runs-on: windows-2025-vs2026

    defaults:
      run:
        shell: msys2 {0}

    steps:
    - name: Check out sources
      uses: actions/checkout@v6
      with:
        fetch-depth: 1

    - name: Check compact Claude layout
      shell: pwsh
      run: python .\tools\maintenance\check-claude-layout.py

    - name: Check Markdown links
      shell: pwsh
      run: python .\tools\maintenance\check-doc-links.py

    - name: Audit config defaults
      shell: pwsh
      run: .\tools\ci\audits\audit-config-defaults.ps1

    - name: Audit HUD key parity
      shell: pwsh
      run: .\tools\ci\audits\audit-hud-key-parity.ps1 -Strict

    - name: Check inc ownership
      shell: pwsh
      run: .\tools\ci\audits\check-inc-ownership.ps1

    - name: Audit Metroid literal budget
      shell: pwsh
      run: .\tools\ci\audits\audit-metroid-literal-budget.ps1 -Budget 1

    - name: Audit platform scatter budget
      shell: pwsh
      run: .\tools\ci\audits\audit-platform-scatter-budget.ps1 -Budget 22

    - name: Audit color dialog prefs
      shell: pwsh
      run: .\tools\ci\audits\audit-color-dialog-prefs.ps1

    - name: Audit MelonPrime SRP performance
      shell: pwsh
      run: .\tools\ci\audits\audit-melonprime-srp-performance.ps1

    - name: Audit Software raster parity contract
      shell: pwsh
      run: python .\tools\ci\audits\audit-raster-software-parity.py

    - name: Audit Custom HUD radar color-key contract
      shell: pwsh
      run: python .\tools\ci\audits\audit-radar-color-key-contract.py

    - name: Audit Classic On-Screen Edit layout contract
      shell: pwsh
      run: python .\tools\ci\audits\audit-onscreen-edit-classic-layout.py

    - name: Audit low-latency marker and vendor ABI contract
      shell: pwsh
      run: python .\tools\ci\audits\audit-low-latency-contract.py

    - name: Audit renderer telemetry zero-overhead contract
      shell: pwsh
      run: python .\tools\ci\audits\audit-renderer-perf-zero-overhead.py

    - name: Audit GPU memory production-overhead contract
      shell: pwsh
      run: python .\tools\ci\audits\audit-renderer-memory-production-overhead.py

    - name: Audit explicit renderer late-fence contract
      shell: pwsh
      run: python .\tools\ci\audits\audit-explicit-renderer-late-fence.py

    - name: Audit Vulkan native surface visibility contract
      shell: pwsh
      run: python .\tools\ci\audits\audit-vulkan-native-surface-visibility.py

    - name: Verify generated HUD schema
      shell: pwsh
      run: |
        python .\tools\codegen\hud\generate-hud-prop-schema.py
        git diff --exit-code -- `
          src/frontend/qt_sdl/MelonPrimeHudPropSchema.inc `
          src/frontend/qt_sdl/InputConfig/MelonPrimeInputConfigHudDialogProps.inc `
          src/frontend/qt_sdl/MelonPrimeHudConfigOnScreenEditProps.inc `
          docs/generated/hud/MelonPrimeHudPropSchemaPhase2a.md

    - name: Cache MSYS2 packages
      uses: actions/cache@v4
      with:
        path: |
          C:/msys64/var/cache/pacman/pkg
          C:/msys64/etc/pacman.d/gnupg
        key: ${{ runner.os }}-msys2-pacman-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-msys2-pacman-

    - name: Remove stale MSYS2 temp directory
      shell: pwsh
      run: |
        if (Test-Path 'D:\a\_temp\msys64') {
          Remove-Item 'D:\a\_temp\msys64' -Recurse -Force
        }

    - name: Set up MSYS2
      uses: msys2/setup-msys2@v2
      with:
        msystem: ucrt64
        update: false
        path-type: minimal
        pacboy: >-
          gcc:p
          cmake:p
          ninja:p
          make:p
          pkgconf:p
          shaderc:p
          vulkan-headers:p

    - name: Restore vcpkg binary cache
      id: restore-vcpkg-binary-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ github.workspace }}/vcpkg_binary_cache
        key: ${{ runner.os }}-vcpkg-binary-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json', 'cmake/ConfigureVcpkg.cmake', 'cmake/overlay-triplets/*.cmake', 'cmake/overlay-ports/**') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-binary-${{ env.VCPKG_COMMIT }}-

    - name: Ensure binary cache directory exists
      run: |
        mkdir -p "${{ github.workspace }}/vcpkg_binary_cache"

    - name: Set up vcpkg
      id: setup_vcpkg
      continue-on-error: true
      uses: lukka/run-vcpkg@v11
      with: &vcpkg_setup_with
        vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}

    # run-vcpkg's bootstrap downloads a prebuilt vcpkg.exe from GitHub on
    # every cold checkout (not cached) and has no retry of its own; observed
    # failing the whole step outright on a transient blip
    # (WinHttpReceiveResponse 0x2F78, "server returned an invalid or
    # unrecognized response"). Retry the whole step once more before letting
    # the job fail.
    - name: Retry setting up vcpkg
      if: steps.setup_vcpkg.outcome == 'failure'
      uses: lukka/run-vcpkg@v11
      with: *vcpkg_setup_with

    - name: Cache vcpkg downloads
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/vcpkg/downloads
        key: ${{ runner.os }}-vcpkg-downloads-${{ env.VCPKG_COMMIT }}-${{ hashFiles('vcpkg.json', 'cmake/overlay-ports/**') }}
        restore-keys: |
          ${{ runner.os }}-vcpkg-downloads-${{ env.VCPKG_COMMIT }}-

    - name: Cache shipping CMake build directory
      uses: actions/cache@v4
      with:
        path: ${{ github.workspace }}/build/release-mingw-shipping-x86_64
        key: ${{ runner.os }}-cmake-shipping-build-${{ hashFiles('CMakeLists.txt', 'src/**', 'include/**', 'cmake/**', 'CMakePresets.json', 'vcpkg.json') }}
        restore-keys: |
          ${{ runner.os }}-cmake-shipping-build-

    - name: Configure
      run: |
        cmake --preset=release-mingw-shipping-x86_64 \
          -DMELONDS_EMBED_BUILD_INFO=ON \
          -DMELONPRIME_ENABLE_VULKAN=ON \
          -DMELONPRIME_FORCE_DISABLE_VULKAN=OFF \
          -DMELONPRIME_ENABLE_GPU_MEMORY_TELEMETRY=OFF \
          -DCMAKE_BUILD_PARALLEL_LEVEL=${{ env.CMAKE_BUILD_PARALLEL_LEVEL }}
      env:
        NINJA_STATUS: "[%f/%t %o/s %es] "

    - name: Verify shipping Release feature gates
      run: |
        set -eu
        cache=build/release-mingw-shipping-x86_64/CMakeCache.txt
        grep -F 'CMAKE_BUILD_TYPE:STRING=Release' "$cache"
        grep -F 'ENABLE_LTO_RELEASE:BOOL=OFF' "$cache"
        grep -F 'MELONPRIME_ENABLE_DEVELOPER_FEATURES:BOOL=OFF' "$cache"
        grep -F 'MELONPRIME_ENABLE_RENDERER_PERF_TELEMETRY:BOOL=OFF' "$cache"
        grep -F 'MELONPRIME_ENABLE_GPU_MEMORY_TELEMETRY:BOOL=OFF' "$cache"
        grep -F 'MELONPRIME_ENABLE_VULKAN_LATENCY_CAPTURE:BOOL=OFF' "$cache"
        grep -F 'MELONPRIME_ENABLE_VULKAN:BOOL=ON' "$cache"
        grep -F 'MELONPRIME_ENABLE_DX12:BOOL=ON' "$cache"
        grep -F 'MELONPRIME_FORCE_DISABLE_VULKAN:BOOL=OFF' "$cache"
        grep -F 'MELONPRIME_FORCE_DISABLE_DX12:BOOL=OFF' "$cache"

    - name: Save vcpkg binary cache
      if: steps.restore-vcpkg-binary-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      continue-on-error: true
      with:
        path: ${{ github.workspace }}/vcpkg_binary_cache
        key: ${{ steps.restore-vcpkg-binary-cache.outputs.cache-primary-key }}

    - name: Build
      run: |
        cmake --build --preset=release-mingw-shipping-x86_64 --parallel ${{ env.CMAKE_BUILD_PARALLEL_LEVEL }}
      env:
        NINJA_STATUS: "[%f/%t %o/s %es] "

    - name: Audit shipping binary GPU memory strings
      shell: pwsh
      run: python .\tools\ci\audits\audit-renderer-memory-production-overhead.py --binary .\build\release-mingw-shipping-x86_64\melonPrimeDS.exe

    - name: Run raster edge executable vectors
      run: |
        cmake --build --preset=release-mingw-shipping-x86_64 --target melonprime_raster_edge_vectors
        ./build/release-mingw-shipping-x86_64/melonprime_raster_edge_vectors.exe

    - name: Check Vulkan SPIR-V source synchronization
      shell: pwsh
      run: python .\tools\vulkan\compile-shaders.py --check-source-sync

    - name: Check DX12 generated shader source synchronization
      shell: pwsh
      run: python .\tools\dx12\compile-shaders.py --check-source-sync

    - name: Compile all DX12 shader geometry variants
      shell: pwsh
      run: python .\tools\ci\audits\check-dx12-shaders.py

    - name: Build with Vulkan completely disabled
      run: |
        cmake --preset=release-mingw-shipping-x86_64 \
          -B build/release-mingw-shipping-vulkan-off \
          -DMELONPRIME_ENABLE_VULKAN=OFF \
          -DMELONPRIME_FORCE_DISABLE_VULKAN=ON
        cmake --build build/release-mingw-shipping-vulkan-off --parallel ${{ env.CMAKE_BUILD_PARALLEL_LEVEL }}

    - name: Verify developer HUD golden harness is absent from release binary
      run: |
        ! strings ./build/release-mingw-shipping-x86_64/melonPrimeDS.exe | grep -E 'melonprime-hud-golden|MelonPrime HUD golden|CustomHud_RunGoldenHarness'

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: melonPrimeDS-windows-x86_64
        path: ./build/release-mingw-shipping-x86_64/melonPrimeDS.exe
