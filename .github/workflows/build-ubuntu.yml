name: Ubuntu

on:
  workflow_dispatch:
  # Called by nightly-release.yml; keep this workflow's own triggers unchanged.
  workflow_call:
  push:
    branches:
      - main
      - ci/*
  pull_request:
    branches:
      - main

env:
  MELONDS_GIT_BRANCH: ${{ github.ref }}
  MELONDS_GIT_HASH: ${{ github.sha }}
  MELONDS_BUILD_PROVIDER: GitHub Actions
  # Ubuntu 22.04's distro headers predate VK_NV_low_latency2 and
  # VK_AMD_anti_lag. Pin the build-time headers while retaining the distro
  # Vulkan loader, validation layers and drivers for the runtime smoke test.
  VULKAN_HEADERS_COMMIT: b5c8f996196ba4aa6d8f97e52b5d3b6e70f7e4e2
  MELONPRIME_VULKAN_HEADERS_DIR: ${{ github.workspace }}/Vulkan-Headers/include
#  MELONDS_VERSION_SUFFIX: " RC"

jobs:
  audit:
    name: Audits
    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v6
      name: Check out sources

    - name: Check compact Claude layout
      run: python ./tools/maintenance/check-claude-layout.py

    - name: Check Markdown links
      run: python ./tools/maintenance/check-doc-links.py

    - name: Audit config defaults
      shell: pwsh
      run: ./tools/ci/audits/audit-config-defaults.ps1

    - name: Audit HUD key parity
      shell: pwsh
      run: ./tools/ci/audits/audit-hud-key-parity.ps1 -Strict

    - name: Check inc ownership
      shell: pwsh
      run: ./tools/ci/audits/check-inc-ownership.ps1

    - name: Audit Metroid literal budget
      shell: pwsh
      run: ./tools/ci/audits/audit-metroid-literal-budget.ps1 -Budget 1

    - name: Audit platform scatter budget
      shell: pwsh
      run: ./tools/ci/audits/audit-platform-scatter-budget.ps1 -Budget 22

    - name: Audit color dialog prefs
      shell: pwsh
      run: ./tools/ci/audits/audit-color-dialog-prefs.ps1

    - name: Audit MelonPrime SRP performance
      shell: pwsh
      run: ./tools/ci/audits/audit-melonprime-srp-performance.ps1

    - name: Audit Software raster parity contract
      run: python ./tools/ci/audits/audit-raster-software-parity.py

    - name: Audit Custom HUD radar color-key contract
      run: python ./tools/ci/audits/audit-radar-color-key-contract.py

    - name: Audit Classic On-Screen Edit layout contract
      run: python ./tools/ci/audits/audit-onscreen-edit-classic-layout.py

    - name: Audit low-latency marker and vendor ABI contract
      run: python ./tools/ci/audits/audit-low-latency-contract.py

    - name: Audit renderer telemetry zero-overhead contract
      run: python ./tools/ci/audits/audit-renderer-perf-zero-overhead.py

    - name: Audit GPU memory production-overhead contract
      run: python ./tools/ci/audits/audit-renderer-memory-production-overhead.py

    - name: Audit Vulkan native surface visibility contract
      run: python ./tools/ci/audits/audit-vulkan-native-surface-visibility.py

    - name: Audit Vulkan Linux presenter retire contract
      run: python ./tools/ci/audits/audit-vulkan-linux-presenter-retire-contract.py

    # The Vulkan backend ships its SPIR-V as committed generated sources, so a
    # GLSL edit that was never regenerated, or a variant that stopped compiling,
    # would only show up as a black screen on a machine with a Vulkan GPU. Both
    # tools skip cleanly when the shader toolchain is missing, so install it.
    - name: Install Vulkan shader toolchain
      run: |
        sudo apt update
        sudo apt install -y glslang-tools spirv-tools

    - name: Verify committed Vulkan SPIR-V source synchronization
      run: python ./tools/vulkan/compile-shaders.py --check-source-sync

    - name: Audit Vulkan compute shaders
      run: python ./tools/ci/audits/check-vulkan-shaders.py

    - name: Verify generated HUD schema
      shell: pwsh
      run: |
        python ./tools/codegen/hud/generate-hud-prop-schema.py
        git diff --exit-code -- \
          src/frontend/qt_sdl/MelonPrimeHudPropSchema.inc \
          src/frontend/qt_sdl/InputConfig/MelonPrimeInputConfigHudDialogProps.inc \
          src/frontend/qt_sdl/MelonPrimeHudConfigOnScreenEditProps.inc \
          docs/generated/hud/MelonPrimeHudPropSchemaPhase2a.md

  build:
    needs: [audit]
    continue-on-error: true
    strategy:
      matrix:
        arch:
          - runner: ubuntu-22.04
            name: x86_64
          - runner: ubuntu-22.04-arm
            name: aarch64

    name: ${{ matrix.arch.name }}
    runs-on: ${{ matrix.arch.runner }}

    steps:
    - uses: actions/checkout@v6
      name: Check out sources

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install --allow-downgrades cmake ninja-build extra-cmake-modules libpcap0.8-dev libsdl2-dev libenet-dev \
          qt6-{base,base-private,multimedia}-dev qt6-wayland libqt6svg6-dev libarchive-dev libzstd-dev libfuse2 libfaad-dev libxi-dev \
          wayland-protocols libwayland-bin libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers xvfb

    - name: Install pinned Vulkan headers
      run: |
        git init Vulkan-Headers
        git -C Vulkan-Headers remote add origin https://github.com/KhronosGroup/Vulkan-Headers.git
        git -C Vulkan-Headers fetch --depth 1 origin "${VULKAN_HEADERS_COMMIT}"
        git -C Vulkan-Headers checkout --detach FETCH_HEAD
        grep -F 'VK_NV_LOW_LATENCY_2_EXTENSION_NAME' "${MELONPRIME_VULKAN_HEADERS_DIR}/vulkan/vulkan_core.h"
        grep -F 'VK_AMD_ANTI_LAG_EXTENSION_NAME' "${MELONPRIME_VULKAN_HEADERS_DIR}/vulkan/vulkan_core.h"

    - name: Configure Release build
      run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DMELONDS_EMBED_BUILD_INFO=ON -DMELONPRIME_ENABLE_DEVELOPER_FEATURES=OFF -DMELONPRIME_ENABLE_RENDERER_PERF_TELEMETRY=OFF -DMELONPRIME_ENABLE_GPU_MEMORY_TELEMETRY=OFF -DMELONPRIME_ENABLE_VULKAN_LATENCY_CAPTURE=OFF -DMELONPRIME_WAYLAND_POINTER_LOCK=ON -DMELONPRIME_ENABLE_VULKAN=ON -DMELONPRIME_FORCE_DISABLE_VULKAN=OFF -DMELONPRIME_VULKAN_INCLUDE_DIR="${MELONPRIME_VULKAN_HEADERS_DIR}"

    - name: Build
      run: |
        cmake --build build
        DESTDIR=AppDir cmake --install build

    - name: Run raster edge executable vectors
      run: |
        cmake --build build --target melonprime_raster_edge_vectors
        ./build/melonprime_raster_edge_vectors

    - name: Build with Vulkan completely disabled
      run: |
        cmake -B build-vulkan-off -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DMELONPRIME_ENABLE_DEVELOPER_FEATURES=OFF -DMELONPRIME_ENABLE_RENDERER_PERF_TELEMETRY=OFF -DMELONPRIME_ENABLE_GPU_MEMORY_TELEMETRY=OFF -DMELONPRIME_ENABLE_VULKAN_LATENCY_CAPTURE=OFF -DMELONPRIME_WAYLAND_POINTER_LOCK=ON -DMELONPRIME_ENABLE_VULKAN=OFF -DMELONPRIME_FORCE_DISABLE_VULKAN=ON
        cmake --build build-vulkan-off

    - name: Build Vulkan debug validation configuration
      if: matrix.arch.name == 'x86_64'
      run: |
        cmake -B build-validation -G Ninja -DCMAKE_BUILD_TYPE=Debug -DMELONPRIME_ENABLE_DEVELOPER_FEATURES=OFF -DMELONPRIME_ENABLE_RENDERER_PERF_TELEMETRY=OFF -DMELONPRIME_ENABLE_GPU_MEMORY_TELEMETRY=OFF -DMELONPRIME_ENABLE_VULKAN_LATENCY_CAPTURE=OFF -DMELONPRIME_WAYLAND_POINTER_LOCK=ON -DMELONPRIME_ENABLE_VULKAN=ON -DMELONPRIME_FORCE_DISABLE_VULKAN=OFF -DMELONPRIME_VULKAN_INCLUDE_DIR="${MELONPRIME_VULKAN_HEADERS_DIR}"
        cmake --build build-validation

    # No ROM is loaded here (CI cannot ship one). The smoke-only environment
    # switch keeps the Linux native child visible long enough to exercise the
    # full show -> snapshot -> surface -> presenter/swapchain path without
    # changing normal no-ROM splash behavior. Each validation profile gets its
    # own settings file and log so Core, SyncVal, Best Practices and GPU-AV are
    # separate gates rather than one blended result.
    #
    # At the 30s mark, timeout sends SIGTERM to xvfb-run, which tears down
    # its Xvfb server; melonPrimeDS then sees its X connection break and
    # begins an async shutdown. Platform::Log() writes via plain vprintf()
    # with no fflush(), and stdout here is a redirected file rather than a
    # tty, so glibc fully buffers it -- the log lines this step asserts on
    # can still be sitting in that buffer, unwritten, when xvfb-run's own
    # exit lets `timeout` return control to this script (confirmed: a run
    # captured with "Show Vulkan validation log" below had every assertion
    # satisfied once melonPrimeDS finally exited, moments after the grep
    # step had already read and failed against an incomplete file). Rather
    # than patch upstream-owned Platform.cpp's buffering, force melonPrimeDS
    # itself unbuffered from here with stdbuf so every write() lands
    # immediately, independent of how or when the process is torn down.
    - name: Run Vulkan validation profile smoke tests
      if: matrix.arch.name == 'x86_64'
      run: |
        mkdir -p build-validation/portable
        printf '3D.Renderer = 3\nScreen.VSync = false\n' > build-validation/portable/melonDS.toml
        for profile in core sync best-practices gpu-av; do
          python ./tools/testing/vulkan-validation-profile.py \
            --profile "$profile" \
            --output "build-validation/vk_layer_settings.txt"
          set +e
          (cd build-validation && \
            MELONPRIME_VULKAN_SMOKE=1 SDL_AUDIODRIVER=dummy \
            timeout 30s xvfb-run -a stdbuf -o0 -e0 ./melonPrimeDS \
            > "vulkan-validation-$profile.log" 2>&1)
          status=$?
          set -e
          test "$status" -eq 0 -o "$status" -eq 124
          python ./tools/ci/audits/verify-vulkan-linux-smoke.py \
            "build-validation/vulkan-validation-$profile.log"
          python ./tools/ci/audits/verify-vulkan-validation-profile.py \
            --profile "$profile" \
            --log "build-validation/vulkan-validation-$profile.log" \
            --settings build-validation/vk_layer_settings.txt
        done
        cp build-validation/vulkan-validation-sync.log build-validation/vulkan-validation.log

    # The smoke test above redirects the run to a log file it asserts
    # against without ever printing it, so a failure otherwise gives no
    # evidence to act on. Surface it unconditionally.
    - name: Show Vulkan validation logs
      if: always() && matrix.arch.name == 'x86_64'
      run: cat build-validation/vulkan-validation-*.log || true

    # This diagnostic artifact is useful evidence, but a transient GitHub
    # artifact-service timeout must not prevent the release binary from being
    # uploaded. Retry the upload explicitly: upload-artifact@v7 does not have
    # a retry-limit input, and retrying with overwrite handles a partial first
    # attempt that created the artifact before the request timed out.
    - name: Upload Vulkan validation log (attempt 1)
      id: upload_vulkan_validation_log_1
      if: always() && matrix.arch.name == 'x86_64'
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: vulkan-validation-log-${{ matrix.arch.name }}
        path: build-validation/vulkan-validation-*.log
        archive: false

    - name: Wait before retrying Vulkan validation log upload
      if: always() && matrix.arch.name == 'x86_64' && steps.upload_vulkan_validation_log_1.outcome == 'failure'
      run: sleep 15

    - name: Upload Vulkan validation log (attempt 2)
      id: upload_vulkan_validation_log_2
      if: always() && matrix.arch.name == 'x86_64' && steps.upload_vulkan_validation_log_1.outcome == 'failure'
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: vulkan-validation-log-${{ matrix.arch.name }}
        path: build-validation/vulkan-validation-*.log
        archive: false
        overwrite: true

    - name: Wait before final Vulkan validation log upload retry
      if: always() && matrix.arch.name == 'x86_64' && steps.upload_vulkan_validation_log_2.outcome == 'failure'
      run: sleep 15

    - name: Upload Vulkan validation log (attempt 3)
      id: upload_vulkan_validation_log_3
      if: always() && matrix.arch.name == 'x86_64' && steps.upload_vulkan_validation_log_2.outcome == 'failure'
      continue-on-error: true
      uses: actions/upload-artifact@v7
      with:
        name: vulkan-validation-log-${{ matrix.arch.name }}
        path: build-validation/vulkan-validation-*.log
        archive: false
        overwrite: true

    - name: Verify developer HUD golden harness is absent from release binary
      run: |
        ! strings AppDir/usr/bin/melonPrimeDS | grep -E 'melonprime-hud-golden|MelonPrime HUD golden|CustomHud_RunGoldenHarness'

    - name: Compress binary
      run: |
        zip -j melonPrimeDS-linux-${{ matrix.arch.name }}.zip AppDir/usr/bin/melonPrimeDS

    - uses: actions/upload-artifact@v7
      with:
        name: melonPrimeDS-linux-${{ matrix.arch.name }}
        path: melonPrimeDS-linux-${{ matrix.arch.name }}.zip
        archive: false

    - name: Fetch AppImage tools
      run: |
        wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-${{ matrix.arch.name }}.AppImage
        wget https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-${{ matrix.arch.name }}.AppImage
        chmod a+x linuxdeploy-*.AppImage

        # appimagetool (invoked internally by linuxdeploy's "appimage" output
        # plugin below) downloads this runtime from GitHub on every run and
        # has no retry of its own; observed failing the whole build outright
        # on a transient blip ("Failed to download runtime: server returned
        # status code 0"). Fetch it ourselves with retries and hand it to
        # the plugin via LDAI_RUNTIME_FILE so a blip here doesn't fail the
        # AppImage step.
        wget --tries=5 --waitretry=5 --retry-connrefused \
          -O runtime-${{ matrix.arch.name }} \
          https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-${{ matrix.arch.name }}

    - name: Build the AppImage
      env:
        EXTRA_PLATFORM_PLUGINS: libqwayland-egl.so;libqwayland-generic.so
        EXTRA_QT_PLUGINS: waylandcompositor
        OUTPUT: melonPrimeDS-${{ matrix.arch.name }}.AppImage
        QMAKE: /usr/lib/qt6/bin/qmake
        LDAI_RUNTIME_FILE: ${{ github.workspace }}/runtime-${{ matrix.arch.name }}
      run: |
        ./linuxdeploy-${{ matrix.arch.name }}.AppImage --appdir AppDir --plugin qt --output appimage

    - name: Compress AppImage
      run: |
        zip -j melonPrimeDS-linux-appimage-${{ matrix.arch.name }}.zip melonPrimeDS-${{ matrix.arch.name }}.AppImage

    - uses: actions/upload-artifact@v7
      with:
        name: melonPrimeDS-linux-appimage-${{ matrix.arch.name }}
        path: melonPrimeDS-linux-appimage-${{ matrix.arch.name }}.zip
        archive: false

  all-artifacts:
    name: All Linux artifacts
    needs: [build]
    runs-on: ubuntu-22.04
    continue-on-error: true

    steps:
    - name: Download x86_64 binary
      uses: actions/download-artifact@v8
      continue-on-error: true
      with:
        name: melonPrimeDS-linux-x86_64.zip
        path: linux-x86_64
        skip-decompress: true

    - name: Download aarch64 binary
      uses: actions/download-artifact@v8
      continue-on-error: true
      with:
        name: melonPrimeDS-linux-aarch64.zip
        path: linux-aarch64
        skip-decompress: true

    - name: Download x86_64 AppImage
      uses: actions/download-artifact@v8
      continue-on-error: true
      with:
        name: melonPrimeDS-linux-appimage-x86_64.zip
        path: linux-appimage-x86_64
        skip-decompress: true

    - name: Download aarch64 AppImage
      uses: actions/download-artifact@v8
      continue-on-error: true
      with:
        name: melonPrimeDS-linux-appimage-aarch64.zip
        path: linux-appimage-aarch64
        skip-decompress: true

    - name: Bundle all Linux artifacts
      run: |
        artifacts=()
        for f in \
          linux-x86_64/melonPrimeDS-linux-x86_64.zip \
          linux-aarch64/melonPrimeDS-linux-aarch64.zip \
          linux-appimage-x86_64/melonPrimeDS-linux-appimage-x86_64.zip \
          linux-appimage-aarch64/melonPrimeDS-linux-appimage-aarch64.zip
        do
          if [ -f "$f" ]; then
            artifacts+=("$f")
          fi
        done
        if [ ${#artifacts[@]} -eq 0 ]; then
          echo "No Linux artifacts available to bundle"
          exit 1
        fi
        zip -j melonPrimeDS-linux-all.zip "${artifacts[@]}"

    - name: Upload bundled Linux artifacts
      uses: actions/upload-artifact@v7
      with:
        name: melonPrimeDS-linux-all
        path: melonPrimeDS-linux-all.zip
        archive: false
