name: BSD

on:
  workflow_dispatch:
  # Called by nightly-release.yml; keep this workflow's own triggers unchanged.
  workflow_call:
  push:
    branches:
      - main
      - ci/*
  pull_request:
    branches:
      - main

env:
  MELONDS_GIT_BRANCH: ${{ github.ref }}
  MELONDS_GIT_HASH: ${{ github.sha }}
  MELONDS_BUILD_PROVIDER: GitHub Actions

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        flavor: [freebsd, netbsd, openbsd]
        # The emulated aarch64 VMs are quite slow, so disable aarch64
        # runs for now.
        arch: [x86_64] #, aarch64]
        include:
          - flavor: freebsd
            os_name: FreeBSD
            install_deps: >
              pkg install -y cmake kf6-extra-cmake-modules pkgconf ninja
              qt6-base qt6-multimedia qt6-svg sdl2 libarchive zstd enet
              faad2 zip vulkan-headers vulkan-loader python3

          - flavor: netbsd
            os_name: NetBSD
            # The NetBSD VM image does not come with X sets by default,
            # so download and unpack the sets we need manually.
            # See https://github.com/vmactions/netbsd-vm/issues/2
            # Also, for some reason pkg_add is not in $PATH, so we have
            # to call it using its absolute location.
            #
            # The actual root cause of every "no pkg found for X" error seen
            # chasing this (dbus>=0.91, qt6-qtbase>=6.11.1nb1, ...): this
            # extraction loop originally built its URL from `$PKG_PATH`, but
            # that variable is never set in this shell, and every run logged
            # "sh: PKG_PATH: parameter not set" for it -- meaning the X sets
            # were NEVER actually being extracted, on any run, since this
            # workaround was added. `pkg_add`/pkgin's dependency resolver
            # correctly detects the resulting gap (no /usr/X11R7/lib on the
            # VM at all) and refuses to treat a package as "found" once its
            # own X11 client-library requirements can't be satisfied --
            # which is most of our GUI-facing dependency tree (dbus,
            # qt6-qtbase, SDL2, qt6-qtmultimedia's transitive deps, ...).
            # Confirmed by downloading xbase.tar.xz directly: it does
            # contain usr/X11R7/lib/libX11.so.7, libxcb.so.2, etc. -- the
            # release set is fine, only the extraction was silently a no-op.
            # Use the same cdn.NetBSD.org base the pkgin repository below
            # already resolves to instead of the unset variable.
            #
            # Separately (real, independently confirmed, and worth keeping
            # regardless): pkgin's default "10.0" repository is pkgsrc trunk
            # rebuilt continuously package-by-package rather than as an
            # atomic batch, which showed a real qt6-qtbase/qt6-qtlanguageserver
            # version skew in a failing run's pkg_install-err.log (pkgsrc.se:
            # qt6-qtbase 6.11.1nb2 was tagged 2026-07-30, so the builder was
            # mid-rebuild). A frozen quarterly branch built as a coherent set
            # avoids that skew; re-pin the quarter forward if it is ever
            # retired from the mirror.
            #
            # The quarter is pinned to the "11.0" ABI branch (11.0_2026Q2),
            # matched to the VM's "release: 11.0" below, not "10.0". Both
            # need to move together:
            #   - The VM's base OpenSSL soname is tied to its NetBSD major
            #     release (10.0 ships libcrypto.so.15, 11.0 ships a newer
            #     one); pkgsrc packages dynamically link against whatever
            #     the build host's base OpenSSL was, so a "10.0" quarter's
            #     curl/qt6-qtbase/cmake/etc. fail with "libssl.so.15 ...
            #     not present" when pkgin runs them on an "11.0" VM release.
            #   - Going the other way is broken too: the "10.0_2026Q2"
            #     quarter's libunistring-1.4.2 binary references libc's
            #     mbrtoc32/mbrtoc16/c16rtomb/c32rtomb, which NetBSD only
            #     added in 11.0 (2024-08-15, per netbsd.org/changes/
            #     changes-11.0.html) and never backported to the 10.x
            #     branch -- so that "10.0"-labelled binary was actually
            #     built against an 11.0 host, and the final melonPrimeDS
            #     link fails with "undefined reference to `mbrtoc32'" on a
            #     genuine "10.0" VM. Confirmed both directories are
            #     internally consistent and carry every package this
            #     workflow needs (including libunistring) by listing
            #     cdn.NetBSD.org/pub/pkgsrc/packages/NetBSD/x86_64/
            #     11.0_2026Q2/All directly.
            prepare_vm: |
              /usr/sbin/pkg_add pkgin curl
              echo 'https://cdn.NetBSD.org/pub/pkgsrc/packages/NetBSD/x86_64/11.0_2026Q2/All' \
                > /usr/pkg/etc/pkgin/repositories.conf
              base=https://cdn.NetBSD.org/pub/NetBSD
              mach=$(uname -m | sed "s/evbarm/evbarm-$(uname -p)/")
              rel=NetBSD-$(uname -r)
              for set in xbase xcomp; do
                curl -sL $base/$rel/$mach/binary/sets/$set.tar.xz |
                  tar xJpf - -C /
              done
            # `pkgin update` builds the local summary from the
            # repositories.conf entry above. A short retry covers genuine
            # transient failures fetching pkg_summary.gz from the CDN
            # (observed: "Service Unavailable"); pkgin/pkg_add are
            # idempotent, so retrying the whole update+install is safe.
            # `success` is checked explicitly at the end -- a `while` loop
            # that merely runs out of iterations exits 0 in POSIX sh, which
            # would otherwise report the step as passing even after every
            # attempt failed.
            install_deps: >
              success=0; i=1; while [ $i -le 3 ]; do
              if pkgin -y update && pkgin -y install cmake
              extra-cmake-modules pkgconf ninja-build qt6-qtbase
              qt6-qtmultimedia qt6-qtsvg SDL2 libarchive zstd enet faad2 zip
              vulkan-headers vulkan-loader python313;
              then success=1; break; fi;
              echo "pkgin attempt $i failed, retrying in $((i * 10))s..." >&2;
              sleep $((i * 10)); i=$((i + 1)); done; [ "$success" -eq 1 ]

          - flavor: openbsd
            os_name: OpenBSD
            # pkg_add pulls individual package files straight from the
            # OpenBSD CDN mirror as it walks the dependency tree, rather
            # than resolving against a prefetched summary like pkgin does.
            # A single mirror hiccup on one leaf package (observed:
            # "ftp: connect: No route to host" fetching zimg-3.0.6, a
            # transitive dep of qt6-qtmultimedia's ffmpeg) aborts that
            # package and cascades into "can't resolve" failures for every
            # package that (transitively) depends on it, even though
            # everything else installed fine. Retry the whole install a
            # few times; pkg_add skips packages it already installed, so
            # re-running only needs to fetch what failed.
            install_deps: >
              success=0; i=1; while [ $i -le 3 ]; do
              if pkg_add -v cmake kf6-extra-cmake-modules pkgconf ninja
              qt6-qtbase qt6-qtmultimedia qt6-qtsvg sdl2 libarchive zstd
              enet faad zip vulkan-headers vulkan-loader python%3;
              then success=1; break; fi;
              echo "pkg_add attempt $i failed, retrying in $((i * 10))s..." >&2;
              sleep $((i * 10)); i=$((i + 1)); done; [ "$success" -eq 1 ]

    name: ${{ matrix.os_name }} / ${{ matrix.arch }}
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: ${{ matrix.flavor }} {0}

    steps:
    - uses: actions/checkout@v6
      name: Check out sources

    - name: Start ${{ matrix.os_name }} VM
      id: start_vm
      continue-on-error: true
      uses: jenseng/dynamic-uses@v1
      with: &vm_start_with
        uses: vmactions/${{ matrix.flavor }}-vm@v1
        # As we are using multiple steps, we need to use NFS to sync the
        # workspace between host and VM, as with the default, rsync, the
        # workspace is only synced before and after the setup VM step.
        #
        # NetBSD only: pin the VM's release to 11.0, matched to the
        # 11.0_2026Q2 pkgsrc quarter set above -- see the long comment on
        # that quarter pin for why the two must move together (base
        # OpenSSL soname one direction, libc's mbrtoc32 the other). This
        # happens to be vmactions/netbsd-vm's own current default (see its
        # conf/default.release.conf), but it is pinned explicitly rather
        # than left implicit so a future default bump there can't silently
        # decouple the VM release from the pkgsrc quarter again.
        with: >
          {
            "arch": ${{ matrix.arch }},
            "envs": "MELONDS_GIT_BRANCH MELONDS_GIT_HASH
                     MELONDS_BUILD_PROVIDER",
            "prepare": ${{ toJSON(matrix.prepare_vm) }},
            "sync": "nfs",
            "usesh": "true",
            ${{ matrix.flavor == 'netbsd' && '"release": "11.0",' || '' }}
          }

    # vmactions/*-vm downloads its anyvm.py bootstrapper from GitHub on
    # every run (not cached) and its own internal retry -- 4 attempts with
    # exponential backoff, confirmed in CI logs -- has still been observed
    # to lose to a transient "socket hang up" and fail the step outright,
    # on a run where every other job succeeded. Retry the whole step once
    # more before letting the job fail.
    - name: Retry ${{ matrix.os_name }} VM start
      if: steps.start_vm.outcome == 'failure'
      uses: jenseng/dynamic-uses@v1
      with: *vm_start_with

    - name: Install dependencies
      run: ${{ matrix.install_deps }}

    - name: Audit renderer telemetry zero-overhead contract
      run: |
        set -eu

        # NetBSD's python313 package provides a versioned executable such as
        # /usr/pkg/bin/python3.13 and does not necessarily install python3.
        python_cmd=""
        for candidate in \
          python3.14 python3.13 python3.12 python3 python \
          /usr/pkg/bin/python3.14 /usr/pkg/bin/python3.13 \
          /usr/pkg/bin/python3.12 /usr/pkg/bin/python3
        do
          if [ -x "$candidate" ] || command -v "$candidate" >/dev/null 2>&1; then
            python_cmd="$candidate"
            break
          fi
        done
        if [ -z "$python_cmd" ]; then
          echo "Python 3 is required for the renderer telemetry audit."
          exit 1
        fi
        echo "Using Python executable: $python_cmd"
        "$python_cmd" tools/ci/audits/audit-renderer-perf-zero-overhead.py

    # pkgin's failure summary ("pkg_install warnings: N, errors: N") names
    # neither the packages nor the reason; the detail only goes to this file
    # inside the VM. Surface it so a failure here is diagnosable from the CI
    # log instead of needing a follow-up run just to see what broke.
    - name: Show NetBSD pkg_install error log
      if: always() && matrix.flavor == 'netbsd'
      run: cat /var/db/pkgin/pkg_install-err.log || true

    - name: Configure
      run: |
        set -eu
        configure_log=/tmp/melonprime-bsd-vulkan-configure.log
        cmake -S "$GITHUB_WORKSPACE" -B /tmp/build -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DMELONDS_EMBED_BUILD_INFO=ON \
          -DMELONPRIME_ENABLE_DEVELOPER_FEATURES=OFF \
          -DMELONPRIME_ENABLE_RENDERER_PERF_TELEMETRY=OFF \
          -DMELONPRIME_ENABLE_VULKAN_LATENCY_CAPTURE=OFF \
          -DMELONPRIME_ENABLE_VULKAN=ON \
          -DMELONPRIME_REQUIRE_QT6_5=ON \
          -DMELONPRIME_FORCE_DISABLE_VULKAN=OFF \
          >"$configure_log" 2>&1
        cat "$configure_log"
        grep -F "MelonPrime Vulkan backend: enabled" "$configure_log"

    - name: Verify Qt 6.5+
      run: |
        set -eu

        qt_version=""
        qt_source=""
        for package in Qt6Core Qt6Core6; do
          candidate="$(pkg-config --modversion "$package" 2>/dev/null || true)"
          if [ -n "$candidate" ]; then
            qt_version="$candidate"
            qt_source="pkg-config:$package"
            break
          fi
        done
        if [ -z "$qt_version" ]; then
          for tool in qtpaths6 qtpaths; do
            if command -v "$tool" >/dev/null 2>&1; then
              candidate="$("$tool" --qt-version 2>/dev/null || true)"
              if [ -n "$candidate" ]; then
                qt_version="$candidate"
                qt_source="$tool"
                break
              fi
            fi
          done
        fi
        if [ -z "$qt_version" ]; then
          echo "Qt 6 version could not be queried."
          exit 1
        fi
        qt_major="${qt_version%%.*}"
        qt_minor="${qt_version#*.}"
        qt_minor="${qt_minor%%.*}"
        case "$qt_major" in ''|*[!0-9]*) echo "Invalid Qt major version: $qt_version"; exit 1;; esac
        case "$qt_minor" in ''|*[!0-9]*) echo "Invalid Qt minor version: $qt_version"; exit 1;; esac
        if [ "$qt_major" -lt 6 ] || { [ "$qt_major" -eq 6 ] && [ "$qt_minor" -lt 5 ]; }; then
          echo "Qt $qt_version is too old; Qt 6.5+ is required."
          exit 1
        fi
        echo "qt_version=$qt_version source=$qt_source"

    - name: Verify Vulkan headers
      run: |
        set -eu

        # Probe the package prefixes directly. This avoids BSD-specific find
        # expression differences while still checking the actual installed
        # Vulkan header rather than assuming a package name implies a path.
        headers=""
        for include_root in /usr/local/include /usr/pkg/include /usr/X11R6/include /usr/X11R7/include; do
          candidate="$include_root/vulkan/vulkan.h"
          if [ -f "$candidate" ]; then
            headers="$candidate"
            break
          fi
        done
        if [ -z "$headers" ]; then
          echo "Vulkan headers were not found in the BSD package prefixes."
          exit 1
        fi
        echo "vulkan_headers=$headers"

    - name: Verify Vulkan loader candidate files
      run: |
        set -eu

        loader=""
        for lib_root in /usr/local/lib /usr/pkg/lib /usr/X11R6/lib /usr/X11R7/lib; do
          for candidate in "$lib_root"/libvulkan.so "$lib_root"/libvulkan.so.*; do
            if [ -f "$candidate" ]; then
              loader="$candidate"
              break 2
            fi
          done
        done
        if [ -z "$loader" ]; then
          echo "Vulkan loader library was not found after package installation."
          exit 1
        fi
        case "$loader" in
          *.so|*.so.*) ;;
          *) echo "Unexpected Vulkan loader name: $loader"; exit 1 ;;
        esac
        echo "vulkan_loader=$loader"

    - name: Verify shader source sync
      run: |
        set -eu

        python_cmd=""
        for candidate in \
          python3.14 python3.13 python3.12 python3 python \
          /usr/pkg/bin/python3.14 /usr/pkg/bin/python3.13 \
          /usr/pkg/bin/python3.12 /usr/pkg/bin/python3
        do
          if [ -x "$candidate" ] || command -v "$candidate" >/dev/null 2>&1; then
            python_cmd="$candidate"
            break
          fi
        done
        if [ -z "$python_cmd" ]; then
          echo "Python 3 is required for the compiler-independent Vulkan shader sync audit."
          exit 1
        fi
        echo "Using Python executable: $python_cmd"
        "$python_cmd" tools/vulkan/compile-shaders.py --check-source-sync

    - name: Build and run production Vulkan loader open check
      run: |
        set -eu
        cmake --build /tmp/build \
          --target melonprime_vulkan_loader_open_check --parallel 1

    - name: Build and run BSD Vulkan validation targets
      run: |
        set -eu
        cmake --build /tmp/build \
          --target melonprime_vulkan_present_timing_check --parallel 1
        cmake --build /tmp/build \
          --target melonprime_vulkan_present_pacer_dispatch_check --parallel 1
        cmake --build /tmp/build --parallel 1

    - name: Build Vulkan-disabled BSD variant
      run: |
        set -eu
        configure_log=/tmp/melonprime-bsd-vulkan-off-configure.log
        cmake -S "$GITHUB_WORKSPACE" -B /tmp/build-vulkan-off -G Ninja \
          -DCMAKE_BUILD_TYPE=Release \
          -DMELONDS_EMBED_BUILD_INFO=ON \
          -DMELONPRIME_ENABLE_DEVELOPER_FEATURES=OFF \
          -DMELONPRIME_ENABLE_RENDERER_PERF_TELEMETRY=OFF \
          -DMELONPRIME_ENABLE_VULKAN_LATENCY_CAPTURE=OFF \
          -DMELONPRIME_ENABLE_VULKAN=OFF \
          -DMELONPRIME_REQUIRE_QT6_5=ON \
          -DMELONPRIME_FORCE_DISABLE_VULKAN=ON \
          >"$configure_log" 2>&1
        cat "$configure_log"
        grep -F "MelonPrime Vulkan backend: disabled" "$configure_log"
        cmake --build /tmp/build-vulkan-off --parallel 1

    - name: Build and package binary
      # MELONPRIME_BSD_LOCAL_PACKAGE_V3
      # Build and create the ZIP entirely on the BSD VM's local /tmp filesystem.
      # Copy only the completed ZIP to the NFS-backed GitHub workspace.
      run: |
        set -eu
        binary=""

        for candidate in \
          /tmp/build/src/frontend/qt_sdl/melonPrimeDS \
          /tmp/build/src/frontend/qt_sdl/melonDS \
          /tmp/build/melonPrimeDS \
          /tmp/build/melonDS
        do
          if [ -f "$candidate" ]; then
            binary="$candidate"
            break
          fi
        done

        if [ -z "$binary" ]; then
          binary="$(
            find /tmp/build \
              -type f \( -name 'melonPrimeDS' -o -name 'melonDS' \) \
              -print 2>/dev/null | head -n 1 || true
          )"
        fi

        if [ -z "$binary" ] || [ ! -s "$binary" ]; then
          echo "Expected BSD executable was not found after a successful build."
          echo "Candidate files:"
          find /tmp/build -maxdepth 8 -type f -print 2>/dev/null || true
          exit 1
        fi

        package_dir="/tmp/melonPrimeDS-bsd-package-${{ matrix.flavor }}-${{ matrix.arch }}"
        local_zip="/tmp/melonPrimeDS-bsd-${{ matrix.flavor }}-${{ matrix.arch }}.zip"
        workspace_zip="$GITHUB_WORKSPACE/melonPrimeDS-bsd-${{ matrix.flavor }}-${{ matrix.arch }}.zip"

        rm -rf "$package_dir"
        rm -f "$local_zip" "$workspace_zip"
        mkdir -p "$package_dir"

        cp "$binary" "$package_dir/melonPrimeDS"
        test -s "$package_dir/melonPrimeDS"

        (
          cd "$package_dir"
          zip -9 -j "$local_zip" melonPrimeDS
        )

        test -s "$local_zip"
        echo "Created ZIP inside BSD VM:"
        ls -l "$local_zip"
        zip -sf "$local_zip"

        cp "$local_zip" "$workspace_zip"
        test -s "$workspace_zip"

        echo "Copied completed ZIP to GitHub workspace:"
        ls -l "$workspace_zip"

    - name: Upload binary
      uses: actions/upload-artifact@v7
      with:
        name: melonPrimeDS-bsd-${{ matrix.flavor }}-${{ matrix.arch }}.zip
        path: melonPrimeDS-bsd-${{ matrix.flavor }}-${{ matrix.arch }}.zip
        archive: false

  all-artifacts:
    name: All BSD artifacts
    needs: [build]
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
    - name: Download FreeBSD x86_64
      uses: actions/download-artifact@v8
      continue-on-error: true
      with:
        name: melonPrimeDS-bsd-freebsd-x86_64.zip
        path: bsd-freebsd-x86_64
        skip-decompress: true

    - name: Download NetBSD x86_64
      uses: actions/download-artifact@v8
      continue-on-error: true
      with:
        name: melonPrimeDS-bsd-netbsd-x86_64.zip
        path: bsd-netbsd-x86_64
        skip-decompress: true

    - name: Download OpenBSD x86_64
      uses: actions/download-artifact@v8
      continue-on-error: true
      with:
        name: melonPrimeDS-bsd-openbsd-x86_64.zip
        path: bsd-openbsd-x86_64
        skip-decompress: true

    - name: Bundle all BSD artifacts
      run: |
        set -eu
        shopt -s nullglob

        artifacts=(bsd-*/*.zip)

        echo "Downloaded BSD artifact files:"
        find . -maxdepth 3 -type f -print || true

        if [ ${#artifacts[@]} -eq 0 ]; then
          echo "No BSD artifacts available to bundle"
          exit 1
        fi

        zip -j melonPrimeDS-bsd-all.zip "${artifacts[@]}"
        ls -l melonPrimeDS-bsd-all.zip

    - name: Upload bundled BSD artifacts
      uses: actions/upload-artifact@v7
      with:
        name: melonPrimeDS-bsd-all
        path: melonPrimeDS-bsd-all.zip
        archive: false
