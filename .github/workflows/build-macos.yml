name: macOS

on:
  workflow_dispatch:
  # Called by nightly-release.yml; keep this workflow's own triggers unchanged.
  workflow_call:
  push:
    branches:
      - main
      - ci/*
  pull_request:
    branches:
      - main

env:
  MELONDS_GIT_BRANCH: ${{ github.ref }}
  MELONDS_GIT_HASH: ${{ github.sha }}
  MELONDS_BUILD_PROVIDER: GitHub Actions
  MOLTENVK_VERSION: v1.4.0
  MOLTENVK_MACOS_URL: https://github.com/KhronosGroup/MoltenVK/releases/download/v1.4.0/MoltenVK-macos.tar
  MOLTENVK_MACOS_SHA256: f4feaf6a4988352de8e6d49874ccc1cd6a45021e3cb476e8531bef7ecc73e93a
#  MELONDS_VERSION_SUFFIX: " RC"

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]

    name: ${{ matrix.arch }}
    runs-on: macos-26

    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache,readwrite

    steps:
      - name: Check out sources
        uses: actions/checkout@v6

      - name: Audit renderer telemetry zero-overhead contract
        run: python3 tools/ci/audits/audit-renderer-perf-zero-overhead.py

      - name: Audit GPU memory production-overhead contract
        run: python3 tools/ci/audits/audit-renderer-memory-production-overhead.py

      - name: Audit Classic On-Screen Edit layout contract
        run: python3 tools/ci/audits/audit-onscreen-edit-classic-layout.py

      - name: Audit physical renderer A/B provenance and phase contract
        run: python3 tools/ci/audits/audit-renderer-physical-ab-contract.py

      - name: Test physical renderer A/B deterministic summarizer
        run: python3 tools/testing/summarize-renderer-physical-ab-tests.py

      - name: Install dependencies for package building
        run: |
          brew install autoconf automake autoconf-archive libtool python-setuptools

      # Build-time only: the Vulkan renderer is compiled against these headers
      # but links nothing, so the same headers serve both matrix architectures.
      # The MoltenVK driver itself is loaded with dlopen() at runtime.
      - name: Install Vulkan headers
        run: |
          brew install vulkan-headers

      - name: Fetch pinned MoltenVK runtime
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .deps
          curl -fL --retry 3 -o .deps/MoltenVK-macos.tar "$MOLTENVK_MACOS_URL"
          echo "$MOLTENVK_MACOS_SHA256  .deps/MoltenVK-macos.tar" | shasum -a 256 -c -
          tar -xf .deps/MoltenVK-macos.tar -C .deps
          test -f .deps/MoltenVK/MoltenVK/dynamic/dylib/macOS/libMoltenVK.dylib
          test -f .deps/MoltenVK/LICENSE
          lipo .deps/MoltenVK/MoltenVK/dynamic/dylib/macOS/libMoltenVK.dylib -verify_arch "${{ matrix.arch }}"

      - name: Set up CMake
        uses: lukka/get-cmake@latest

      - name: Install Metal compiler toolchain
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -downloadComponent MetalToolchain
          xcrun --find metal

      - name: Restore vcpkg cache
        id: restore-vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-${{ matrix.arch }}-osx-${{ hashFiles('vcpkg.json', 'CMakePresets.json', 'cmake/ConfigureVcpkg.cmake', 'cmake/overlay-triplets/*.cmake', 'cmake/overlay-ports/**') }}
          restore-keys: vcpkg-${{ matrix.arch }}-osx-

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgJsonGlob: vcpkg.json

      - name: Build
        uses: lukka/run-cmake@v10
        with:
          configurePreset: release-mac-${{ matrix.arch }}
          buildPreset: release-mac-${{ matrix.arch }}
          configurePresetAdditionalArgs: "['-DCMAKE_BUILD_TYPE=Release', '-DMELONDS_EMBED_BUILD_INFO=ON', '-DMELONPRIME_ENABLE_DEVELOPER_FEATURES=OFF', '-DMELONPRIME_ENABLE_INPUT_DEBUG_TELEMETRY=OFF', '-DMELONPRIME_ENABLE_RENDERER_PERF_TELEMETRY=OFF', '-DMELONPRIME_ENABLE_GPU_MEMORY_TELEMETRY=OFF', '-DMELONPRIME_ENABLE_VULKAN_LATENCY_CAPTURE=OFF', '-DMELONPRIME_ENABLE_VULKAN=ON', '-DMELONPRIME_FORCE_DISABLE_VULKAN=OFF', '-DMELONPRIME_MOLTENVK_DYLIB=${{ github.workspace }}/.deps/MoltenVK/MoltenVK/dynamic/dylib/macOS/libMoltenVK.dylib', '-DMELONPRIME_MOLTENVK_LICENSE=${{ github.workspace }}/.deps/MoltenVK/LICENSE']"

      - name: Run production Vulkan retire-frame mapping test
        if: always()
        shell: bash
        run: cmake --build "build/release-mac-${{ matrix.arch }}" --target melonprime_vulkan_frame_retire_check --parallel 1

      - name: Verify raster parity contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/audits/audit-raster-software-parity.py
          python3 tools/ci/audits/audit-radar-color-key-contract.py
          cmake --build "build/release-mac-${{ matrix.arch }}" --target melonprime_raster_edge_vectors
          "build/release-mac-${{ matrix.arch }}/melonprime_raster_edge_vectors"
          python3 tools/ci/audits/compile-metal-compute-msl.py

      - name: Verify bundled MoltenVK
        shell: bash
        run: |
          set -euo pipefail
          app="build/release-mac-${{ matrix.arch }}/melonPrimeDS.app"
          test -f "$app/Contents/Frameworks/libMoltenVK.dylib"
          test -f "$app/Contents/Resources/ThirdPartyNotices/MoltenVK-LICENSE.txt"
          lipo "$app/Contents/Frameworks/libMoltenVK.dylib" -verify_arch "${{ matrix.arch }}"
          lipo -info "$app/Contents/Frameworks/libMoltenVK.dylib"

      - name: Verify app signature
        shell: bash
        run: |
          codesign --verify --deep --strict build/release-mac-${{ matrix.arch }}/melonPrimeDS.app

      # The bundle checks above prove that MoltenVK is packaged, but they do
      # not create a Vulkan instance or a CAMetalLayer surface. Run the native
      # arm64 artifact on the macOS host so the MoltenVK WSI path is exercised
      # without claiming an external physical-device or latency result.
      - name: Run MoltenVK runtime smoke
        if: matrix.arch == 'arm64'
        shell: bash
        run: |
          set -euo pipefail
          app="build/release-mac-${{ matrix.arch }}/melonPrimeDS.app"
          portable="build/release-mac-${{ matrix.arch }}/portable"
          log="$RUNNER_TEMP/melonprime-moltenvk-runtime.log"
          mkdir -p "$portable"
          printf '3D.Renderer = 5\nScreen.UseGL = false\nScreen.VSync = false\nEmu.DirectBoot = false\n' > "$portable/melonDS.toml"
          python3 - "$app/Contents/MacOS/melonPrimeDS" "$log" <<'PY'
          import os
          import signal
          import subprocess
          import sys

          executable, log_path = sys.argv[1:]
          env = os.environ.copy()
          env["SDL_AUDIODRIVER"] = "dummy"
          timed_out = False
          with open(log_path, "w", encoding="utf-8") as log:
              process = subprocess.Popen(
                  [executable],
                  stdout=log,
                  stderr=subprocess.STDOUT,
                  env=env,
              )
              try:
                  # Hosted Apple-Paravirtual/MoltenVK startup can spend more
                  # than 15 seconds compiling the first presentation
                  # pipelines. The no-ROM smoke is expected to remain alive,
                  # so the log markers below are the actual readiness gate.
                  process.wait(timeout=60)
              except subprocess.TimeoutExpired:
                  timed_out = True
                  process.send_signal(signal.SIGTERM)
                  try:
                      process.wait(timeout=15)
                  except subprocess.TimeoutExpired:
                      process.kill()
                      process.wait()
          print(
              f"MoltenVK runtime smoke exited {process.returncode}"
              + (" after the expected readiness timeout" if timed_out else ""),
              file=sys.stderr,
          )
          # A no-ROM smoke has no natural successful exit. Once the readiness
          # timeout has expired, a non-zero code can come from the intentional
          # shutdown path; the shell assertions below still require complete
          # Vulkan/presenter initialization and reject validation failures.
          if not timed_out and process.returncode != 0:
              raise SystemExit(f"MoltenVK runtime smoke exited {process.returncode}")
          print(log_path)
          PY
          cat "$log"
          grep -F '[Vulkan] instance created' "$log"
          grep -E '\[Vulkan\] presentation surface created( from snapshot)? backend=VK_EXT_metal_surface' "$log"
          grep -F '[Vulkan] presentation: requested-vsync=off' "$log"
          grep -F '[Vulkan] presenter ready:' "$log"
          ! grep -E 'VUID-|SYNC-HAZARD|DEVICE_LOST|\[Vulkan\] runtime failure' "$log"

      - name: Upload MoltenVK runtime smoke log
        if: always() && matrix.arch == 'arm64'
        uses: actions/upload-artifact@v7
        with:
          name: moltenvk-runtime-smoke-${{ matrix.arch }}
          path: ${{ runner.temp }}/melonprime-moltenvk-runtime.log
          if-no-files-found: warn
          archive: false

      - name: Compress app bundle
        shell: bash
        run: |
          cd build/release-mac-${{ matrix.arch }}
          zip -r -y ../../melonPrimeDS-macOS-${{ matrix.arch }}.zip melonPrimeDS.app

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: melonPrimeDS-macOS-${{ matrix.arch }}
          path: melonPrimeDS-macOS-${{ matrix.arch }}.zip
          retention-days: 1
          archive: false

      - name: Save vcpkg cache
        if: steps.restore-vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: ${{ steps.restore-vcpkg-cache.outputs.cache-primary-key }}

  # GitHub also provides an Intel macOS host. Run the x86_64 bundle there to
  # retain an Intel-host MoltenVK diagnostic separate from the Apple-Silicon
  # result above. This is informational: it is not native Intel Vulkan, and
  # the hosted Metal virtual device has exhibited startup failures that must
  # remain visible in the artifact without gating the shipping build.
  runtime-macos-intel:
    name: Intel macOS MoltenVK diagnostic (non-gating)
    needs: [build-macos]
    runs-on: macos-26-intel

    steps:
      - name: Download x86_64 bundle
        uses: actions/download-artifact@v8
        with:
          name: melonPrimeDS-macOS-x86_64.zip
          path: x86_64
          skip-decompress: true

      - name: Run MoltenVK runtime diagnostic on Intel host
        shell: bash
        run: |
          set -euo pipefail
          zip_path=x86_64/melonPrimeDS-macOS-x86_64.zip
          [ -f "$zip_path" ] || { echo "x86_64 artifact not found at $zip_path"; exit 1; }
          unzip "$zip_path" -d x86_64
          app="$PWD/x86_64/melonPrimeDS.app"
          portable="$PWD/x86_64/portable"
          log="$RUNNER_TEMP/melonprime-moltenvk-intel-runtime.log"
          mkdir -p "$portable"
          printf '3D.Renderer = 5\n3D.GL.ScaleFactor = 1\nScreen.UseGL = false\nScreen.VSync = false\nEmu.DirectBoot = false\n' > "$portable/melonDS.toml"
          python3 - "$app/Contents/MacOS/melonPrimeDS" "$log" <<'PY'
          import os
          import signal
          import subprocess
          import sys

          executable, log_path = sys.argv[1:]
          env = os.environ.copy()
          env["SDL_AUDIODRIVER"] = "dummy"
          with open(log_path, "w", encoding="utf-8") as log:
              process = subprocess.Popen(
                  [executable],
                  stdout=log,
                  stderr=subprocess.STDOUT,
                  env=env,
              )
              try:
                  process.wait(timeout=15)
              except subprocess.TimeoutExpired:
                  process.send_signal(signal.SIGTERM)
                  try:
                      process.wait(timeout=15)
                  except subprocess.TimeoutExpired:
                      process.kill()
                      process.wait()
          print(
              f"Intel-host MoltenVK runtime diagnostic exited {process.returncode}; "
              "the result is retained as non-gating evidence.",
              file=sys.stderr,
          )
          print(log_path)
          PY
          cat "$log"
          if grep -F '[Vulkan] renderer requested=Vulkan presenter actual=Vulkan' "$log" \
            && grep -E '\[Vulkan\] presentation surface created( from snapshot)? backend=VK_EXT_metal_surface' "$log" \
            && grep -F '[Vulkan] presentation: requested-vsync=off' "$log" \
            && grep -F '[Vulkan] presenter ready:' "$log" \
            && ! grep -E 'VUID-|SYNC-HAZARD|DEVICE_LOST|\[Vulkan\] runtime failure' "$log"; then
            echo 'Intel-host MoltenVK diagnostic: PASS'
          else
            echo 'Intel-host MoltenVK diagnostic: NOT PASS (see uploaded log; non-gating)'
          fi

      - name: Upload Intel-host MoltenVK runtime log
        if: always()
        # This diagnostic is explicitly non-gating. A transient artifact-service
        # DNS/upload failure must not turn the informational Intel-host job red.
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: moltenvk-intel-runtime-diagnostic
          path: ${{ runner.temp }}/melonprime-moltenvk-intel-runtime.log
          if-no-files-found: warn
          archive: false

  universal-binary:
    name: Universal binary
    needs: [build-macos]
    runs-on: macos-26

    steps:
      - name: Download x86_64
        uses: actions/download-artifact@v8
        with:
          name: melonPrimeDS-macOS-x86_64.zip
          path: x86_64
          skip-decompress: true

      - name: Download arm64
        uses: actions/download-artifact@v8
        with:
          name: melonPrimeDS-macOS-arm64.zip
          path: arm64
          skip-decompress: true

      - name: Combine app bundles
        shell: bash
        run: |
          set -euo pipefail
          x86_zip=x86_64/melonPrimeDS-macOS-x86_64.zip
          arm64_zip=arm64/melonPrimeDS-macOS-arm64.zip
          [ -f "$x86_zip" ] || { echo "x86_64 artifact not found at $x86_zip"; exit 1; }
          [ -f "$arm64_zip" ] || { echo "arm64 artifact not found at $arm64_zip"; exit 1; }
          unzip "$x86_zip" -d x86_64
          unzip "$arm64_zip" -d arm64
          lipo {x86_64,arm64}/melonPrimeDS.app/Contents/MacOS/melonPrimeDS -create -output melonPrimeDS
          cp -a arm64/melonPrimeDS.app melonPrimeDS.app
          cp melonPrimeDS melonPrimeDS.app/Contents/MacOS/melonPrimeDS
          test -f melonPrimeDS.app/Contents/Frameworks/libMoltenVK.dylib
          test -f melonPrimeDS.app/Contents/Resources/ThirdPartyNotices/MoltenVK-LICENSE.txt
          lipo melonPrimeDS.app/Contents/Frameworks/libMoltenVK.dylib -verify_arch x86_64 arm64
          # Arch builds are ad-hoc signed in CMake (MACOS_ADHOC_SIGN_BUNDLE); lipo
          # replaces the main binary so the bundle must be re-signed with --force.
          codesign --force --sign - --deep --timestamp=none melonPrimeDS.app
          codesign --verify --deep --strict melonPrimeDS.app
          zip -r -y melonPrimeDS-macOS-universal.zip melonPrimeDS.app

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: melonPrimeDS-macOS-universal
          path: melonPrimeDS-macOS-universal.zip
          archive: false

      - name: Bundle all macOS artifacts
        shell: bash
        run: |
          artifacts=()
          for f in \
            x86_64/melonPrimeDS-macOS-x86_64.zip \
            arm64/melonPrimeDS-macOS-arm64.zip \
            melonPrimeDS-macOS-universal.zip
          do
            if [ -f "$f" ]; then
              artifacts+=("$f")
            fi
          done
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "No macOS artifacts available to bundle"
            exit 1
          fi
          zip -j melonPrimeDS-macOS-all.zip "${artifacts[@]}"

      - name: Upload bundled macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: melonPrimeDS-macOS-all
          path: melonPrimeDS-macOS-all.zip
          archive: false
